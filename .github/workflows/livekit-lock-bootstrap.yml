name: Bootstrap LiveKit dependency lockfile
on:
  push:
    branches: [feature/livekit-free-cloud-no-vps-20261103]
    paths:
      - 'package.json'
      - '.github/workflows/livekit-lock-bootstrap.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock
        shell: bash
        run: |
          if git diff --quiet package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock LiveKit browser SDK dependencies"
          git push
