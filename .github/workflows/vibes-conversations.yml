name: Vibes Conversations and Likes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  vibes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Threaded replies, permission rules, paginated likers
        run: node --test tests/vibes-sharing.test.mjs tests/vibes-threads.test.mjs tests/vibes.test.mjs tests/vibes-editor.test.mjs
      - name: Production build and server syntax
        run: npm run check:api && npm run build
      - name: Browser and comment hierarchy check
        run: |
          npx playwright install --with-deps chromium
          node tests/vibes-hierarchy-ui.mjs
      - name: Upload responsive UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibes-thread-artifacts
          path: test-results/vibes-thread-*.png
          if-no-files-found: ignore
