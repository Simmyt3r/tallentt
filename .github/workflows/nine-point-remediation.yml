name: ChombuTar Nine-Point Remediation Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/DiscoverySearch.jsx'
      - 'src/pages/Notifications.jsx'
      - 'src/pages/Vibes.jsx'
      - 'src/components/Layout.jsx'
      - 'src/components/AdminFinanceLedger.jsx'
      - 'src/pages/Live/**'
      - 'src/lib/liveBroadcast.js'
      - 'api/_lib/liveMedia.js'
      - 'api/_lib/financeReporting.js'
      - 'api/admin/index.js'
      - 'tests/nine-point-*.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test nine-point UI and backend behavior
        run: node --test tests/nine-point-hardening.test.mjs tests/nine-point-behavior.test.mjs tests/live-media.test.mjs
      - name: Verify API syntax
        run: npm run check:api
      - name: Build PWA
        run: npm run build
