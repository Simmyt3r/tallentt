name: Navigation and Work Pass UX
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile and desktop profile dropdown and Work Pass
        run: node tests/navigation-workpass-ui.mjs
      - name: Upload navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-work-pass-screenshots
          path: test-results/navigation-work-pass-*.png
          if-no-files-found: ignore
