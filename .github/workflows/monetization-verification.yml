name: ChombuTar Billing Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  monetization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pricing arithmetic
        run: node --test tests/monetization-policy.test.mjs
      - name: SQL migration, wallet and refund tests
        run: node --test tests/monetization-billing.test.mjs tests/dual-role-billing.test.mjs tests/finance-reporting.test.mjs tests/admin-deal-commissions.test.mjs tests/commission-reconciliation.test.mjs tests/booking-integration.test.mjs tests/completion-integration.test.mjs
      - name: Verify server code and build
        run: npm run check:api && npm run build
      - name: Install commission UI browser
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Verify Admin commission audit on mobile and desktop
        run: node tests/admin-commissions-ui.mjs
